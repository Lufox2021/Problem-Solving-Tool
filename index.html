<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problem-Solving Coach</title>
<style>
:root {
  --bg: #F5F3EE; --card: #FFFFFF; --ink: #1D2730; --muted: #5C6974; --line: #DAD5CB; --soft: #EFECE5;
  --accent: #1C5E8A; --accent-ink: #FFFFFF; --ok: #2B7A4B; --ok-bg: #E3F2E8; --bad: #B8382A; --bad-bg: #FBE8E5;
  --warn-bg: #FFF5DC; --hl-blue: #CFE2FA; --hl-blue-ink: #0D4A8F; --hl-orange: #FCE0C2; --hl-orange-ink: #8A4200;
  --shadow: 0 1px 2px rgba(30,30,20,.06), 0 2px 8px rgba(30,30,20,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14191E; --card: #1C232A; --ink: #E6EAED; --muted: #9AA6B0; --line: #33404B; --soft: #232C34;
    --accent: #7CB6DE; --accent-ink: #0C1A24; --ok: #72C595; --ok-bg: #1B3326; --bad: #F08273; --bad-bg: #3A1F1C;
    --warn-bg: #3A3220; --hl-blue: #1E3E62; --hl-blue-ink: #B9D8FA; --hl-orange: #553515; --hl-orange-ink: #FFCF9C;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; margin-bottom: 14px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
.tag { margin: 2px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 7px; font: inherit; font-weight: 600; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar label { font-weight: 600; }
select, input[type=text], textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
select { max-width: 100%; }
textarea { width: 100%; min-height: 84px; resize: vertical; line-height: 1.45; }
input[type=text]:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.btn { font: inherit; font-weight: 600; font-size: 14.5px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { font-size: 13px; padding: 4px 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.spacer { flex: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.problem { position: relative; }
.problem.pinned { position: sticky; top: 0; z-index: 5; max-height: 42vh; overflow: auto; }
.problem h2 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.ptext { font-size: 17.5px; line-height: 1.75; margin: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.ptext p.setup { margin: 0; }
.qs { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.qhead { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.q { display: flex; gap: 8px; font-weight: 600; }
.q + .q { margin-top: 4px; }
.ql { color: var(--muted); min-width: 1.2em; }
.ptext .w { border-radius: 4px; padding: 1px 0; cursor: pointer; }
.ptext .w.hb { background: var(--hl-blue); color: var(--hl-blue-ink); box-shadow: 0 0 0 2px var(--hl-blue); }
.ptext .w.ho { background: var(--hl-orange); color: var(--hl-orange-ink); box-shadow: 0 0 0 2px var(--hl-orange); }
.hltools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.pen-blue.on { background: #2E78D6; border-color: #2E78D6; color: #fff; }
.pen-orange.on { background: #D9771E; border-color: #D9771E; color: #fff; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
.tlabel { font-weight: 600; margin-right: 2px; }
.tchip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.tchip:hover { border-color: var(--accent); }
.tchip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tchip .cnt { font-size: 12px; opacity: .7; margin-left: 2px; }
#rnd { margin-left: 4px; }
.step { display: grid; grid-template-columns: 38px 1fr; gap: 0 12px; }
.num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--soft); color: var(--muted); border: 2px solid var(--line); }
.step.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
.step h3 { margin: 4px 0 8px; font-size: 17px; }
.step .why { color: var(--muted); font-size: 14.5px; margin: -4px 0 8px; }
.step ul.tips { margin: 0 0 6px; padding-left: 20px; color: var(--muted); font-size: 14.5px; }
.status { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.status.ok { color: var(--ok); }
.conf { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.conf .btn { min-width: 38px; }
/* drawing pad */
.padtools { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 8px; }
.padtools .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch.on { outline: 3px solid var(--accent); outline-offset: 1px; }
.padwrap { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.padwrap canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
.padwrap .textin { position: absolute; font: 18px "Segoe UI", system-ui, sans-serif; padding: 2px 4px; border: 1px dashed #1C5E8A; background: #fff; color: #111; min-width: 120px; }
.fillrow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: -2px 0 8px; padding: 6px 10px; background: var(--soft); border-radius: 8px; }
.pats { display: flex; flex-wrap: wrap; gap: 5px; }
.patbtn { padding: 2px; border: 2px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; line-height: 0; }
.patbtn.on { border-color: var(--accent); outline: 2px solid var(--accent); }
.patbtn canvas { width: 44px; height: 26px; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 30px; align-items: center; }
.chip { background: #1C5E8A; color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: grab; touch-action: none; user-select: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips .empty { color: var(--muted); font-size: 14px; }
.ghost { position: fixed; pointer-events: none; z-index: 50; opacity: .9; transform: translate(-50%, -50%); }
/* step 8 */
.lock { background: var(--warn-bg); border-radius: 10px; padding: 12px 14px; }
.lock b { display: block; margin-bottom: 4px; }
.lock ul { margin: 4px 0 0; padding-left: 20px; }
.line { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--soft); }
.lhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.lhead .kind { font-weight: 700; font-size: 14px; }
.lhead input { flex: 1; min-width: 160px; }
.xbtn { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; }
.xbtn:hover { color: var(--bad); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chain .lbl { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 2px; }
.chain .times { font-size: 20px; color: var(--muted); }
.frac { display: inline-grid; grid-template-columns: auto auto; gap: 3px 4px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; position: relative; }
.frac .rule { grid-column: 1 / -1; height: 2px; background: var(--ink); opacity: .6; }
.frac input { width: 92px; padding: 4px 6px; font-size: 14.5px; }
.frac input.n { width: 84px; text-align: right; }
.frac .pw { position: absolute; top: -9px; right: -9px; font-size: 12px; padding: 0 2px; border-radius: 6px; }
.frac .rmf { position: absolute; bottom: -10px; right: -8px; font-size: 16px; }
.qty input { width: 150px; }
.goal input { width: 120px; }
.lmsg { margin-top: 8px; font-size: 14.5px; padding: 7px 10px; border-radius: 8px; }
.lmsg.ok { background: var(--ok-bg); }
.lmsg.bad { background: var(--bad-bg); }
.lmsg.info { background: var(--card); border: 1px dashed var(--line); }
.res { margin-top: 8px; font-size: 16px; }
.res b { font-size: 17px; }
.fx input.expr { width: 100%; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 15px; }
.fxrow { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.fxrow input { width: 130px; }
.help { font-size: 13.5px; color: var(--muted); }
code { font-family: ui-monospace, Consolas, monospace; background: var(--soft); padding: 0 4px; border-radius: 4px; font-size: .92em; }
.parts h4 { margin: 16px 0 6px; font-size: 16px; }
.part { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.part:first-child { border-top: 0; margin-top: 0; }
.ansrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ansrow input { width: 220px; }
.fb { margin-top: 8px; padding: 7px 10px; border-radius: 8px; font-size: 15px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.fb.bad { background: var(--bad-bg); }
.tries { font-size: 13.5px; color: var(--muted); }
.reveal { margin-top: 8px; padding: 9px 12px; border-left: 4px solid var(--accent); background: var(--soft); border-radius: 0 8px 8px 0; white-space: pre-wrap; }
.reveal b { display: block; margin-bottom: 2px; }
.note { font-size: 14px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14.5px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
/* instructor */
.inst h2 { font-size: 19px; margin: 0 0 6px; }
.inst p { margin: 6px 0; }
table.cols { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
table.cols th, table.cols td { text-align: left; border-bottom: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
table.cols th { color: var(--muted); font-weight: 600; }
.errs { background: var(--bad-bg); border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
.errs ul { margin: 4px 0 0; padding-left: 20px; }
.okbox { background: var(--ok-bg); border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
.preview { margin-top: 10px; font-size: 14.5px; }
.preview .pp { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
textarea.json { min-height: 220px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
  h1 { font-size: 25px; }
  .step { grid-template-columns: 1fr; }
  .num { margin-bottom: 4px; }
  .ptext { font-size: 16.5px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Problem-Solving Coach</h1>
      <p class="tag">Read it, picture it, plan it. Then solve it.</p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-solve" aria-selected="true">Solve</button>
      <button role="tab" id="tab-inst" aria-selected="false">Instructor</button>
    </nav>
  </header>

  <section id="view-solve">
    <div class="topics" id="topics"></div>
    <div class="bar">
      <label for="pick">Problem</label>
      <select id="pick"></select>
      <span class="spacer"></span>
      <button class="btn" id="btn-pdf">Export PDF</button>
      <button class="btn" id="btn-reset">Start over</button>
    </div>
    <div class="card problem" id="prob"></div>
    <div id="steps"></div>
  </section>

  <section id="view-inst" class="inst" hidden></section>
</div>
<div class="toast" id="toast"></div>
<script>
const UE = (() => {
  // dims: [length m, mass g, time s, amount mol, count, temperature K]
  // (Copied from Factor-Label-Workbench; temperature dimension added for Problem-Solving Coach.)
  const Dm = (m = 0, g = 0, s = 0, mol = 0, n = 0, k = 0) => [m, g, s, mol, n, k];
  const NA = 6.02214076e23;
  const BASE = {
    m: { f: 1, d: Dm(1) }, g: { f: 1, d: Dm(0, 1) }, s: { f: 1, d: Dm(0, 0, 1) },
    L: { f: 1e-3, d: Dm(3) }, mol: { f: 1, d: Dm(0, 0, 0, 1) },
    J: { f: 1000, d: Dm(2, 1, -2) }, cal: { f: 4184, d: Dm(2, 1, -2) },
    Pa: { f: 1000, d: Dm(-1, 1, -2) }, W: { f: 1000, d: Dm(2, 1, -3) },
    K: { f: 1, d: Dm(0, 0, 0, 0, 0, 1) }
  };
  const GAL = 3.785411784e-3;
  const OTHER = {
    in: { f: 0.0254, d: Dm(1) }, ft: { f: 0.3048, d: Dm(1) }, yd: { f: 0.9144, d: Dm(1) },
    mi: { f: 1609.344, d: Dm(1) }, "Å": { f: 1e-10, d: Dm(1) },
    lb: { f: 453.59237, d: Dm(0, 1) }, oz: { f: 28.349523125, d: Dm(0, 1) },
    ton: { f: 907184.74, d: Dm(0, 1) }, t: { f: 1e6, d: Dm(0, 1) },
    amu: { f: 1.66053906660e-24, d: Dm(0, 1) },
    min: { f: 60, d: Dm(0, 0, 1) }, h: { f: 3600, d: Dm(0, 0, 1) },
    day: { f: 86400, d: Dm(0, 0, 1) }, wk: { f: 604800, d: Dm(0, 0, 1) },
    yr: { f: 365.25 * 86400, d: Dm(0, 0, 1) },
    gal: { f: GAL, d: Dm(3) }, qt: { f: GAL / 4, d: Dm(3) }, pt: { f: GAL / 8, d: Dm(3) },
    cup: { f: GAL / 16, d: Dm(3) }, floz: { f: GAL / 128, d: Dm(3) },
    tbsp: { f: GAL / 256, d: Dm(3) }, tsp: { f: GAL / 768, d: Dm(3) },
    cc: { f: 1e-6, d: Dm(3) },
    M: { f: 1000, d: Dm(-3, 0, 0, 1) }, mM: { f: 1, d: Dm(-3, 0, 0, 1) },   // molarity (added for Problem-Solving Coach)
    atm: { f: 101325e3, d: Dm(-1, 1, -2) }, torr: { f: 101325e3 / 760, d: Dm(-1, 1, -2) },
    mmHg: { f: 133.322387415e3, d: Dm(-1, 1, -2) }, psi: { f: 6894.757293e3, d: Dm(-1, 1, -2) },
    bar: { f: 1e8, d: Dm(-1, 1, -2) }, Cal: { f: 4184e3, d: Dm(2, 1, -2) },
    atoms: { f: 1, d: Dm(0, 0, 0, 0, 1) }, molecules: { f: 1, d: Dm(0, 0, 0, 0, 1) },
    ions: { f: 1, d: Dm(0, 0, 0, 0, 1) }, particles: { f: 1, d: Dm(0, 0, 0, 0, 1) },
    "formula units": { f: 1, d: Dm(0, 0, 0, 0, 1) }
  };
  const ALIAS = {
    hr: "h", hrs: "h", hour: "h", hours: "h", sec: "s", secs: "s", second: "s", seconds: "s",
    mins: "min", minute: "min", minutes: "min", days: "day", d: "day", week: "wk", weeks: "wk",
    year: "yr", years: "yr", y: "yr", lbs: "lb", pound: "lb", pounds: "lb", ounce: "oz", ounces: "oz",
    tons: "ton", inch: "in", inches: "in", foot: "ft", feet: "ft", yard: "yd", yards: "yd",
    mile: "mi", miles: "mi", gallon: "gal", gallons: "gal", quart: "qt", quarts: "qt",
    pint: "pt", pints: "pt", cups: "cup", "fl-oz": "floz", "fl.oz": "floz", Torr: "torr",
    "mm-Hg": "mmHg", u: "amu", Da: "amu", A: "Å", angstrom: "Å",
    atom: "atoms", molecule: "molecules", ion: "ions", particle: "particles", fu: "formula units",
    l: "L", ml: "mL", dl: "dL", cl: "cL", kl: "kL", ul: "μL", "μl": "μL", "µl": "μL",
    moles: "mol", mole: "mol", grams: "g", gram: "g", meter: "m", meters: "m", liter: "L", liters: "L"
  };
  const PREFIX = [["da", 10], ["T", 1e12], ["G", 1e9], ["M", 1e6], ["k", 1e3], ["h", 1e2], ["d", 0.1],
    ["c", 0.01], ["m", 1e-3], ["μ", 1e-6], ["µ", 1e-6], ["u", 1e-6], ["n", 1e-9], ["p", 1e-12], ["f", 1e-15]];

  function lookup(tok) {
    if (ALIAS[tok]) tok = ALIAS[tok];
    if (BASE[tok]) return { sym: tok, ...BASE[tok] };
    if (OTHER[tok]) return { sym: tok, ...OTHER[tok] };
    for (const [p, v] of PREFIX) {
      if (tok.length > p.length && tok.startsWith(p)) {
        const rest = tok.slice(p.length);
        if (BASE[rest]) {
          const pp = (p === "u" || p === "µ") ? "μ" : p;
          return { sym: pp + rest, f: v * BASE[rest].f, d: BASE[rest].d };
        }
      }
    }
    return null;
  }

  // ---- chemistry ----
  const AW = { H: 1.008, He: 4.0026, Li: 6.94, Be: 9.0122, B: 10.81, C: 12.011, N: 14.007, O: 15.999, F: 18.998, Ne: 20.180,
    Na: 22.990, Mg: 24.305, Al: 26.982, Si: 28.085, P: 30.974, S: 32.06, Cl: 35.45, Ar: 39.948, K: 39.098, Ca: 40.078,
    Sc: 44.956, Ti: 47.867, V: 50.942, Cr: 51.996, Mn: 54.938, Fe: 55.845, Co: 58.933, Ni: 58.693, Cu: 63.546, Zn: 65.38,
    Ga: 69.723, Ge: 72.630, As: 74.922, Se: 78.971, Br: 79.904, Kr: 83.798, Rb: 85.468, Sr: 87.62, Y: 88.906, Zr: 91.224,
    Nb: 92.906, Mo: 95.95, Tc: 98, Ru: 101.07, Rh: 102.91, Pd: 106.42, Ag: 107.87, Cd: 112.41, In: 114.82, Sn: 118.71,
    Sb: 121.76, Te: 127.60, I: 126.90, Xe: 131.29, Cs: 132.91, Ba: 137.33, La: 138.91, Ce: 140.12, Pr: 140.91, Nd: 144.24,
    Sm: 150.36, Eu: 151.96, Gd: 157.25, Hf: 178.49, Ta: 180.95, W: 183.84, Re: 186.21, Os: 190.23, Ir: 192.22, Pt: 195.08,
    Au: 196.97, Hg: 200.59, Tl: 204.38, Pb: 207.2, Bi: 208.98, Po: 209, At: 210, Rn: 222, Ra: 226, Th: 232.04, U: 238.03, Pu: 244 };

  function molarMass(formula) {
    if (!formula) return null;
    const f = formula.replace(/\s+/g, "");
    const parts = f.split(/[·•*.]/);
    let total = 0;
    for (let part of parts) {
      let mult = 1;
      const lead = part.match(/^(\d+)(.*)$/);
      if (lead) { mult = +lead[1]; part = lead[2]; }
      const m = parseGroup(part);
      if (m == null) return null;
      total += mult * m;
    }
    return total;
  }
  function parseGroup(s) {
    let i = 0;
    function group() {
      let sum = 0;
      while (i < s.length && s[i] !== ")" && s[i] !== "]") {
        let val;
        if (s[i] === "(" || s[i] === "[") {
          i++; val = group();
          if (val == null || (s[i] !== ")" && s[i] !== "]")) return null;
          i++;
        } else {
          const m = s.slice(i).match(/^([A-Z][a-z]?)/);
          if (!m || AW[m[1]] == null) return null;
          val = AW[m[1]]; i += m[1].length;
        }
        const n = s.slice(i).match(/^(\d+)/);
        let k = 1;
        if (n) { k = +n[1]; i += n[1].length; }
        sum += val * k;
      }
      return sum;
    }
    if (!s) return null;
    const v = group();
    return (v != null && i === s.length) ? v : null;
  }
  const isFormula = (t) => /^[A-Z(\[]/.test(t) && molarMass(t) != null;

  function parseEquation(eq) {
    if (!eq || !eq.trim()) return null;
    const sides = eq.split(/->|→|=>|=/);

ts", "chapter": "1", "text": "A Toyota Prius Hybrid uses 59.7 L of gasoline to drive from San Francisco to Seattle, a distance of 1300 km. (1 mi = 1.609 km; 1 gal = 3.785 L)", "background_image": "", "parts": [{"part": "a", "prompt": "What was the average fuel economy, in miles per gallon?", "type": "numeric", "value": 51.22, "units": "mi/gal", "tolerance": "5%", "alt_answers": [], "hint": "Convert the distance to miles and the fuel to gallons separately, then divide miles by gallons.", "model_solution": "1300 km × (1 mi / 1.609 km) = 808 mi\n59.7 L × (1 gal / 3.785 L) = 15.77 gal\nFuel economy = 808 mi / 15.77 gal = 51.2 mi/gal\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 1.10, Check Your Learning. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}, {"part": "b", "prompt": "If gasoline costs $3.90 per gallon, what was the fuel cost for the trip, in dollars? (Enter just the number.)", "type": "numeric", "value": 61.51, "units": "", "tolerance": "5%", "alt_answers": [], "hint": "You already found the gallons used in part a. Multiply by the price per gallon.", "model_solution": "15.77 gal × ($3.90 / 1 gal) = $61.51\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 1.10, Check Your Learning. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "MEAS-004", "topic": "Measurement & density", "chapter": "1", "text": "The mercury content of a stream was measured at 0.68 parts per billion (ppb) by weight, where 1 ppb means 1 ng of Hg per 1 g of water. The density of the water is 0.998 g/mL.", "background_image": "", "parts": [{"part": "a", "prompt": "What mass of mercury, in grams, is present in 15.0 L of the stream water?", "type": "numeric", "value": 1.018e-05, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "First find the mass of 15.0 L of water (L → mL → g). Then use 0.68 ng Hg per 1 g of water, and convert ng to g.", "model_solution": "15.0 L × (1000 mL / 1 L) × (0.998 g / 1 mL) = 1.497 × 10^4 g water\n1.497 × 10^4 g water × (0.68 ng Hg / 1 g water) = 1.018 × 10^4 ng Hg\n1.018 × 10^4 ng × (1 g / 10^9 ng) = 1.02e-05 g Hg\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 1.6 (mercury in a stream). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "MOLE-001", "topic": "Moles & molar mass", "chapter": "3", "text": "A 55-kg woman has 7.5 x 10^-3 mol of hemoglobin (molar mass = 64,456 g/mol) in her blood. (Avogadro's number = 6.022 x 10^23 per mol.)", "background_image": "", "parts": [{"part": "a", "prompt": "How many hemoglobin molecules is this? (Enter just the number.)", "type": "numeric", "value": 4.517e+21, "units": "", "tolerance": "5%", "alt_answers": [], "hint": "Use Avogadro's number: 6.022 × 10^23 molecules per mole.", "model_solution": "7.5 × 10^-3 mol × (6.022 × 10^23 molecules / 1 mol) = 4.52 × 10^21 molecules\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 3.1 (hemoglobin). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}, {"part": "b", "prompt": "What is the mass of this hemoglobin in grams?", "type": "numeric", "value": 483.4, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Use the molar mass: 64,456 g per mole.", "model_solution": "7.5 × 10^-3 mol × (64,456 g / 1 mol) = 483 g\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 3.1 (hemoglobin). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "MOLE-002", "topic": "Moles & molar mass", "chapter": "3", "text": "A tube of toothpaste contains 0.76 g of sodium monofluorophosphate (Na_2PO_3F) in 100 mL of toothpaste. (Atomic masses in g/mol: Na 22.99, P 30.97, O 16.00, F 19.00. Avogadro's number = 6.022 x 10^23 per mol.)", "background_image": "", "parts": [{"part": "a", "prompt": "What mass of fluorine atoms, in milligrams, is present in the 100 mL?", "type": "numeric", "value": 100.3, "units": "mg", "tolerance": "5%", "alt_answers": [], "hint": "Find the moles of Na_2PO_3F from its molar mass. Each formula unit has one F atom, so moles of F = moles of Na_2PO_3F.", "model_solution": "Molar mass Na_2PO_3F = 143.95 g/mol\n0.76 g × (1 mol / 143.95 g) = 5.280 × 10^-3 mol Na_2PO_3F = mol F\n5.280 × 10^-3 mol F × (19.00 g / 1 mol) = 0.1003 g = 100 mg F\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 3.1 (toothpaste). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}, {"part": "b", "prompt": "How many fluorine atoms are present? (Enter just the number.)", "type": "numeric", "value": 3.179e+21, "units": "", "tolerance": "5%", "alt_answers": [], "hint": "Moles of F × Avogadro's number.", "model_solution": "5.280 × 10^-3 mol F × (6.022 × 10^23 atoms / 1 mol) = 3.18 × 10^21 F atoms\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 3.1 (toothpaste). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "SOLN-001", "topic": "Solutions", "chapter": "3", "text": "The US Environmental Protection Agency limits hexavalent chromium discharged into sewers to 0.50 mg of chromium per liter. A factory discharges its chromium as potassium dichromate, K_2Cr_2O_7. (Atomic mass of Cr = 52.00 g/mol.)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the maximum permissible molarity of K_2Cr_2O_7?", "type": "numeric", "value": 4.808e-06, "units": "M", "tolerance": "5%", "alt_answers": [], "hint": "Start with 0.50 mg Cr in 1 L. Convert mg Cr → g Cr → mol Cr. Each K_2Cr_2O_7 contains 2 Cr atoms.", "model_solution": "0.50 mg Cr × (1 g / 1000 mg) × (1 mol Cr / 52.00 g Cr) = 9.62 × 10^-6 mol Cr\n9.62 × 10^-6 mol Cr × (1 mol K_2Cr_2O_7 / 2 mol Cr) = 4.81 × 10^-6 mol K_2Cr_2O_7\nPer 1 L of solution: 4.81 × 10^-6 M\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 3.3 (EPA chromium limit). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "SOLN-002", "topic": "Solutions", "chapter": "3", "text": "A general chemistry experiment calls for 250 mL of 2.00 M HCl. The stockroom has concentrated 11.9 M HCl.", "background_image": "", "parts": [{"part": "a", "prompt": "What volume of 11.9 M HCl is needed?", "type": "numeric", "value": 42.02, "units": "mL", "tolerance": "5%", "alt_answers": [], "hint": "Moles of HCl don't change when you dilute: M_1V_1 = M_2V_2.", "model_solution": "Moles needed = 2.00 mol/L × 0.250 L = 0.500 mol HCl\nVolume of stock = 0.500 mol × (1 L / 11.9 mol) = 0.0420 L = 42.0 mL\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 3.3 (dilution of HCl). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "SOLN-003", "topic": "Gases", "chapter": "9", "text": "You need to prepare 1.25 L of 3.20 M hydrochloric acid by dissolving HCl gas in water. The HCl gas is measured at 30.0 °C and 745 torr. Assume ideal behavior. (R = 0.08206 L·atm/(mol·K); 760 torr = 1 atm; T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "How many liters of HCl gas are required?", "type": "numeric", "value": 101.5, "units": "L", "tolerance": "5%", "alt_answers": [], "hint": "First find the moles of HCl needed from the molarity and volume. Then use PV = nRT with T in kelvin and P in atm.", "model_solution": "n = 3.20 mol/L × 1.25 L = 4.00 mol HCl\nT = 30.0 + 273.15 = 303.15 K;  P = 745 torr × (1 atm / 760 torr) = 0.980 atm\nV = nRT/P = (4.00 mol)(0.08206 L·atm/(mol·K))(303.15 K) / 0.980 atm = 101.5 L\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 11.3 (HCl gas for a solution). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "STOI-001", "topic": "Stoichiometry", "chapter": "4", "text": "Silicon nitride is a very hard, heat-resistant ceramic used in jet-engine turbine blades. It forms by the reaction 3 Si(s) + 2 N_2(g) → Si_3N_4(s). A chemist reacts 2.00 g of Si with 1.50 g of N_2. (Atomic masses in g/mol: Si 28.09, N 14.01.)", "background_image": "", "parts": [{"part": "a", "prompt": "Which reactant is limiting? Explain how you know.", "type": "ungraded", "model_solution": "Si is limiting. 2.00 g Si = 0.0712 mol, which could make 0.0237 mol Si_3N_4; 1.50 g N_2 = 0.0535 mol, which could make 0.0268 mol Si_3N_4. Si makes less product.\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 4.12. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}, {"part": "b", "prompt": "What mass of Si_3N_4 can form?", "type": "numeric", "value": 3.33, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Find how much Si_3N_4 each reactant could make. The smaller amount wins.", "model_solution": "Si: 2.00 g × (1 mol / 28.09 g) × (1 mol Si_3N_4 / 3 mol Si) = 0.0237 mol Si_3N_4\nN_2: 1.50 g × (1 mol / 28.01 g) × (1 mol Si_3N_4 / 2 mol N_2) = 0.0268 mol Si_3N_4\nSi is limiting: 0.0237 mol × (140.28 g / 1 mol) = 3.33 g Si_3N_4\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 4.12. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "STOI-002", "topic": "Stoichiometry", "chapter": "4", "text": "Hydrogen and oxygen react to form water: 2 H_2(g) + O_2(g) → 2 H_2O(l). A mixture of 5.00 g of H_2 and 10.0 g of O_2 reacts completely. (Atomic masses in g/mol: H 1.008, O 16.00.)", "background_image": "", "parts": [{"part": "a", "prompt": "What mass of water forms?", "type": "numeric", "value": 11.26, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Find the moles of each reactant and decide which runs out first, using the 2:1 ratio.", "model_solution": "H_2: 5.00 g / 2.016 g/mol = 2.48 mol;  O_2: 10.0 g / 32.00 g/mol = 0.3125 mol\nO_2 needs only 0.625 mol H_2, so O_2 is limiting.\n0.3125 mol O_2 × (2 mol H_2O / 1 mol O_2) × (18.02 g / 1 mol) = 11.3 g H_2O\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 4.12, Check Your Learning. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}, {"part": "b", "prompt": "What mass of the excess reactant is left over?", "type": "numeric", "value": 3.74, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Subtract the moles of H_2 used (from the limiting O_2) from the moles you started with.", "model_solution": "H_2 used = 0.3125 mol O_2 × (2 mol H_2 / 1 mol O_2) = 0.625 mol\nH_2 left = 2.480 − 0.625 = 1.855 mol × 2.016 g/mol = 3.74 g H_2\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 4.12, Check Your Learning. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "STOI-003", "topic": "Stoichiometry", "chapter": "4", "text": "Freon-12, CF_2Cl_2, is made by the reaction CCl_4 + 2 HF → CF_2Cl_2 + 2 HCl. A reaction of 32.9 g of CCl_4 with excess HF produces 12.5 g of CF_2Cl_2. (Atomic masses in g/mol: C 12.01, F 19.00, Cl 35.45.)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the percent yield? (Enter the percent, e.g. 75.0 or 75.0%.)", "type": "numeric", "value": 48.33, "units": "", "tolerance": "5%", "alt_answers": ["48.3%"], "hint": "Find the theoretical yield of CF_2Cl_2 from 32.9 g CCl_4 (1:1 mole ratio). Percent yield = actual / theoretical × 100.", "model_solution": "32.9 g CCl_4 × (1 mol / 153.81 g) × (1 mol CF_2Cl_2 / 1 mol CCl_4) × (120.91 g / 1 mol) = 25.9 g (theoretical)\nPercent yield = 12.5 g / 25.9 g × 100 = 48.3%\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Example 4.13, Check Your Learning. https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-001", "topic": "Gases", "chapter": "9", "text": "An automobile air bag inflated to a volume of 66.8 L at 25 °C contains 77.8 g of nitrogen gas, N_2. (R = 8.314 J/(mol·K) = 8.314 Pa·m^3/(mol·K); 1 L = 10^-3 m^3; atomic mass of N = 14.01 g/mol; T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the pressure in the bag, in kilopascals?", "type": "numeric", "value": 103.1, "units": "kPa", "tolerance": "5%", "alt_answers": [], "hint": "Moles of N_2 from its molar mass, T in kelvin, then P = nRT/V. Watch the volume units: with R = 8.314, V must be in m^3 and P comes out in Pa.", "model_solution": "n = 77.8 g / 28.01 g/mol = 2.777 mol;  T = 298.15 K;  V = 0.0668 m^3\nP = nRT/V = (2.777)(8.314)(298.15) / 0.0668 = 1.03e+05 Pa = 103.1 kPa\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (air bag). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-002", "topic": "Gases", "chapter": "9", "text": "A weather balloon contains 8.80 mol of helium at a pressure of 0.992 atm and a temperature of 25 °C at ground level. (R = 0.08206 L·atm/(mol·K); T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the volume of the balloon?", "type": "numeric", "value": 217, "units": "L", "tolerance": "5%", "alt_answers": [], "hint": "Use PV = nRT with T in kelvin.", "model_solution": "V = nRT/P = (8.80 mol)(0.08206)(298.15 K) / 0.992 atm = 217 L\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (weather balloon). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-003", "topic": "Gases", "chapter": "9", "text": "A high-altitude balloon is filled with 1.41 x 10^4 L of hydrogen at 21 °C and 745 torr. The balloon rises to a height of 20 km, where the temperature is −48 °C and the pressure is 63.1 torr. (T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the volume of the balloon at 20 km?", "type": "numeric", "value": 127400, "units": "L", "tolerance": "5%", "alt_answers": [], "hint": "The amount of gas doesn't change: P_1V_1/T_1 = P_2V_2/T_2. Temperatures must be in kelvin.", "model_solution": "T_1 = 294.15 K;  T_2 = 225.15 K\nV_2 = V_1 × (P_1/P_2) × (T_2/T_1) = 1.41 × 10^4 L × (745/63.1) × (225.15/294.15) = 1.27e+05 L\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (high-altitude balloon). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-004", "topic": "Gases", "chapter": "9", "text": "A cylinder of medical oxygen has a volume of 35.4 L and contains O_2 at 151 atm and 25 °C. (T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "What volume would this oxygen occupy at normal body conditions, 1.00 atm and 37 °C?", "type": "numeric", "value": 5561, "units": "L", "tolerance": "5%", "alt_answers": [], "hint": "Same gas, new conditions: P_1V_1/T_1 = P_2V_2/T_2, with T in kelvin.", "model_solution": "V_2 = 35.4 L × (151 atm / 1.00 atm) × (310.15 K / 298.15 K) = 5.56e+03 L\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (medical oxygen). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-005", "topic": "Gases", "chapter": "9", "text": "A 20.0-L cylinder holding 11.34 kg of butane, C_4H_10, is opened to the atmosphere. Gas escapes until the pressure in the cylinder equals atmospheric pressure, 0.983 atm, at 27 °C. (R = 0.08206 L·atm/(mol·K); atomic masses in g/mol: C 12.01, H 1.008; T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "What mass of butane gas remains in the cylinder?", "type": "numeric", "value": 46.4, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "The 11.34 kg doesn't matter for the final state. Use PV = nRT for the gas left in 20.0 L, then convert moles to grams.", "model_solution": "n = PV/RT = (0.983 atm)(20.0 L) / [(0.08206)(300.15 K)] = 0.7982 mol\nMolar mass C_4H_10 = 58.12 g/mol;  mass = 0.7982 mol × 58.12 g/mol = 46.4 g\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (butane cylinder). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-006", "topic": "Gases", "chapter": "9", "text": "As 1 g of radium decays over 1 year, it produces 1.16 x 10^18 alpha particles, and each one becomes an atom of helium gas. The helium occupies 125 mL at 25 °C. (R = 8.314 Pa·m^3/(mol·K); Avogadro's number = 6.022 x 10^23 per mol; T in K = T in °C + 273.15; 1 mL = 10^-6 m^3)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the pressure of the helium, in pascals?", "type": "numeric", "value": 38.2, "units": "Pa", "tolerance": "5%", "alt_answers": [], "hint": "Atoms → moles with Avogadro's number. Then P = nRT/V with V in m^3 (1 mL = 10^-6 m^3).", "model_solution": "n = 1.16 × 10^18 atoms / 6.022 × 10^23 = 1.926 × 10^-6 mol\nP = nRT/V = (1.926 × 10^-6)(8.314)(298.15) / (1.25 × 10^-4 m^3) = 38.2 Pa\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (helium from radium). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "GAS-007", "topic": "Gases", "chapter": "9", "text": "A balloon with a volume of 100.21 L at 21 °C and 0.981 atm is released and just clears the top of Mount Crumpit in British Columbia. At the top, its volume is 144.53 L and the temperature is 5.24 °C. (T in K = T in °C + 273.15)", "background_image": "", "parts": [{"part": "a", "prompt": "What pressure does the balloon experience as it clears the mountain?", "type": "numeric", "value": 0.6437, "units": "atm", "tolerance": "5%", "alt_answers": [], "hint": "Same gas: P_1V_1/T_1 = P_2V_2/T_2. Solve for P_2, with T in kelvin.", "model_solution": "P_2 = P_1 × (V_1/V_2) × (T_2/T_1) = 0.981 atm × (100.21/144.53) × (278.39/294.15) = 0.644 atm\n\nSource: adapted from OpenStax, Chemistry 2e (Flowers, Theopold, Langley, Robinson), Exercises, Section 9.2 (Mount Crumpit). https://openstax.org/books/chemistry-2e. Licensed CC BY-NC-SA 4.0."}]}, {"id": "MEAS-101", "topic": "Measurement & density", "chapter": "1", "text": "A roll of copper foil tape is 12.7 mm wide and 0.035 mm thick. The copper on the roll has a mass of 450 g. The density of copper is 8.96 g/cm^3.", "background_image": "", "parts": [{"part": "a", "prompt": "How long is the tape, in meters?", "type": "numeric", "value": 113, "units": "m", "tolerance": "5%", "alt_answers": [], "hint": "Picture the tape unrolled as a very long, thin box. Volume = length × width × thickness. Get the volume from the mass and density, convert the width and thickness to cm, then solve for the length.", "model_solution": "Volume = 450 g × (1 cm^3 / 8.96 g) = 50.22 cm^3\nWidth = 1.27 cm; thickness = 0.0035 cm; cross-section = 1.27 cm × 0.0035 cm = 0.00445 cm^2\nLength = 50.22 cm^3 / 0.00445 cm^2 = 11299 cm = 113 m\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-102", "topic": "Measurement & density", "chapter": "1", "text": "A solid metal rod is 15.0 cm long and 1.25 cm in diameter. Its mass is 164.9 g. Possible metals: aluminum (2.70 g/cm^3), iron (7.87 g/cm^3), copper (8.96 g/cm^3), lead (11.3 g/cm^3). The volume of a cylinder is πr^2h.", "background_image": "", "parts": [{"part": "a", "prompt": "What is the density of the rod?", "type": "numeric", "value": 8.958, "units": "g/cm^3", "tolerance": "5%", "alt_answers": [], "hint": "The radius is half the diameter. Find the volume of the cylinder, then divide the mass by the volume.", "model_solution": "r = 1.25 cm / 2 = 0.625 cm\nV = π(0.625 cm)^2(15.0 cm) = 18.41 cm^3\nDensity = 164.9 g / 18.41 cm^3 = 8.96 g/cm^3\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "Which metal is the rod most likely made of? Explain.", "type": "ungraded", "model_solution": "Copper: 8.96 g/cm^3 matches the measured density.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-103", "topic": "Measurement & density", "chapter": "1", "text": "A steel ball bearing has a mass of 66.8 g. The density of steel is 7.85 g/cm^3. The volume of a sphere is V = (4/3)πr^3.", "background_image": "", "parts": [{"part": "a", "prompt": "What is the radius of the ball bearing, in millimeters?", "type": "numeric", "value": 12.67, "units": "mm", "tolerance": "5%", "alt_answers": [], "hint": "Get the volume from the mass and density. Then solve V = (4/3)πr^3 for r: r = cube root of (3V / 4π). In a formula line, cbrt( ) takes a cube root.", "model_solution": "V = 66.8 g × (1 cm^3 / 7.85 g) = 8.510 cm^3\nr^3 = 3V / (4π) = 2.0315 cm^3\nr = cube root = 1.2665 cm = 12.67 mm\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-104", "topic": "Measurement & density", "chapter": "1", "text": "A rectangular sandbox measures 6.0 ft by 4.0 ft and is filled with sand to a depth of 10 inches. The density of the sand is 1.60 g/cm^3. (1 in. = 2.54 cm exactly; 12 in. = 1 ft; 1 lb = 453.6 g)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the mass of the sand, in pounds?", "type": "numeric", "value": 1998, "units": "lb", "tolerance": "5%", "alt_answers": [], "hint": "Find the volume in cubic feet (convert the depth to feet first), then convert ft^3 to cm^3. Careful: 1 ft = 30.48 cm, so 1 ft^3 = (30.48)^3 cm^3.", "model_solution": "Depth = 10 in. × (1 ft / 12 in.) = 0.833 ft\nV = 6.0 ft × 4.0 ft × 0.833 ft = 20.0 ft^3\n20.0 ft^3 × (30.48 cm / 1 ft)^3 = 5.663e+05 cm^3\nMass = 5.663e+05 cm^3 × 1.60 g/cm^3 = 9.061e+05 g × (1 lb / 453.6 g) = 1998 lb\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-105", "topic": "Measurement & density", "chapter": "1", "text": "An empty volumetric flask has a mass of 87.32 g. When filled to the mark with 50.00 mL of an unknown clear liquid, the flask and liquid have a mass of 126.77 g. Possible liquids: ethanol (0.789 g/mL), water (0.997 g/mL), glycerol (1.26 g/mL), chloroform (1.48 g/mL).", "background_image": "", "parts": [{"part": "a", "prompt": "What is the density of the liquid?", "type": "numeric", "value": 0.789, "units": "g/mL", "tolerance": "5%", "alt_answers": [], "hint": "The liquid's mass is the full flask minus the empty flask.", "model_solution": "Mass of liquid = 126.77 g − 87.32 g = 39.45 g\nDensity = 39.45 g / 50.00 mL = 0.789 g/mL\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "Which liquid is it most likely to be?", "type": "ungraded", "model_solution": "Ethanol: 0.789 g/mL matches.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-106", "topic": "Measurement & units", "chapter": "1", "text": "A hybrid car is rated at 48 miles per gallon. Its tank holds 35.0 L of gasoline. (1 gal = 3.785 L; 1 mi = 1.609 km)", "background_image": "", "parts": [{"part": "a", "prompt": "How many kilometers can the car travel on a full tank?", "type": "numeric", "value": 714.2, "units": "km", "tolerance": "5%", "alt_answers": [], "hint": "Convert liters to gallons, use the fuel economy to get miles, then convert miles to kilometers.", "model_solution": "35.0 L × (1 gal / 3.785 L) = 9.246 gal\n9.246 gal × (48 mi / 1 gal) = 443.8 mi\n443.8 mi × (1.609 km / 1 mi) = 714 km\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-107", "topic": "Measurement & units", "chapter": "1", "text": "At a swim meet, Swimmer A swims 100.0 meters in 47.0 s. At a different meet, Swimmer B swims 100.0 yards in 42.0 s. (1 yd = 0.9144 m; 1 mi = 1609 m)", "background_image": "", "parts": [{"part": "a", "prompt": "What is Swimmer A's average speed in miles per hour?", "type": "numeric", "value": 4.759, "units": "mi/h", "tolerance": "1%", "alt_answers": [], "hint": "Speed = distance / time. Convert meters to miles and seconds to hours.", "model_solution": "100.0 m / 47.0 s = 2.128 m/s\n2.128 m/s × (1 mi / 1609 m) × (3600 s / 1 h) = 4.759 mi/h\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "What is Swimmer B's average speed in miles per hour?", "type": "numeric", "value": 4.87, "units": "mi/h", "tolerance": "1%", "alt_answers": [], "hint": "Convert yards to meters (or miles) first.", "model_solution": "100.0 yd × (0.9144 m / 1 yd) = 91.44 m\n91.44 m / 42.0 s = 2.177 m/s\n2.177 m/s × (1 mi / 1609 m) × (3600 s / 1 h) = 4.870 mi/h\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "c", "prompt": "Which swimmer is faster? Why can't you tell just by comparing 47.0 s with 42.0 s?", "type": "ungraded", "model_solution": "Swimmer B is faster (about 4.87 mi/h vs. 4.76 mi/h). The times can't be compared directly because the distances are different: 100 yd is shorter than 100 m.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "PCT-101", "topic": "Percent & composition", "chapter": "1", "text": "Table salt (NaCl) is 39.34% sodium by mass. A brand of pretzels contains 1.6 g of salt per 100 g of pretzels. A common guideline is no more than 2.30 g of sodium per day.", "background_image": "", "parts": [{"part": "a", "prompt": "What mass of pretzels contains 2.30 g of sodium?", "type": "numeric", "value": 365.4, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Chain the ratios: g sodium → g salt (39.34 g Na per 100 g salt) → g pretzels (1.6 g salt per 100 g pretzels).", "model_solution": "2.30 g Na × (100 g salt / 39.34 g Na) = 5.847 g salt\n5.847 g salt × (100 g pretzels / 1.6 g salt) = 365 g pretzels\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "PCT-102", "topic": "Percent & composition", "chapter": "1", "text": "A copper ore contains 2.4% chalcopyrite (CuFeS_2) by mass. Chalcopyrite is 34.6% copper by mass. The refining process recovers 92.0% of the copper in the chalcopyrite.", "background_image": "", "parts": [{"part": "a", "prompt": "What mass of ore, in kilograms, must be processed to obtain 5.00 kg of copper?", "type": "numeric", "value": 654.5, "units": "kg", "tolerance": "5%", "alt_answers": [], "hint": "Work backward: kg Cu recovered → kg Cu in the chalcopyrite (92.0 recovered per 100) → kg chalcopyrite (34.6 kg Cu per 100 kg) → kg ore (2.4 kg chalcopyrite per 100 kg ore).", "model_solution": "5.00 kg Cu × (100 / 92.0) = 5.435 kg Cu in chalcopyrite\n5.435 kg Cu × (100 kg CuFeS_2 / 34.6 kg Cu) = 15.71 kg CuFeS_2\n15.71 kg × (100 kg ore / 2.4 kg CuFeS_2) = 654 kg ore\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "PCT-103", "topic": "Percent & composition", "chapter": "1", "text": "A granola bar contains 7.0 g of fat, 29 g of carbohydrate, and 4.0 g of protein. Fat provides 9 Calories per gram; carbohydrate and protein each provide 4 Calories per gram.", "background_image": "", "parts": [{"part": "a", "prompt": "How many Calories does the bar contain?", "type": "numeric", "value": 195, "units": "Cal", "tolerance": "5%", "alt_answers": [], "hint": "Find the Calories from each nutrient separately, then add.", "model_solution": "Fat: 7.0 g × 9 Cal/g = 63 Cal\nCarbohydrate: 29 g × 4 Cal/g = 116 Cal\nProtein: 4.0 g × 4 Cal/g = 16 Cal\nTotal = 195 Cal\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "What percent of the bar's Calories come from fat? (Enter the percent, e.g. 25 or 25%.)", "type": "numeric", "value": 32.31, "units": "", "tolerance": "5%", "alt_answers": ["32.3%"], "hint": "Calories from fat divided by total Calories, times 100.", "model_solution": "63 Cal / 195 Cal × 100 = 32.3%\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-108", "topic": "Measurement & density", "chapter": "1", "text": "A spool of 14-gauge copper wire has a diameter of 0.0640 in. The copper on the spool has a mass of 2.50 lb. The density of copper is 8.96 g/cm^3. (1 in. = 2.54 cm; 1 lb = 453.6 g; 1 ft = 12 in.)", "background_image": "", "parts": [{"part": "a", "prompt": "How many feet of wire are on the spool?", "type": "numeric", "value": 200.1, "units": "ft", "tolerance": "5%", "alt_answers": [], "hint": "The wire is a long cylinder: V = πr^2 × length. Get V from the mass and density, find r in cm, then solve for the length.", "model_solution": "Mass = 2.50 lb × 453.6 g/lb = 1134 g;  V = 1134 g / 8.96 g/cm^3 = 126.6 cm^3\nr = 0.0320 in. × 2.54 cm/in. = 0.08128 cm;  πr^2 = 0.02075 cm^2\nLength = 126.6 cm^3 / 0.02075 cm^2 = 6098 cm = 200 ft\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-109", "topic": "Measurement & density", "chapter": "1", "text": "A goldsmith hammers 31.10 g of gold (one troy ounce) into a very thin sheet of gold leaf covering 21.0 m^2. The density of gold is 19.3 g/cm^3.", "background_image": "", "parts": [{"part": "a", "prompt": "How thick is the gold leaf, in nanometers?", "type": "numeric", "value": 76.73, "units": "nm", "tolerance": "5%", "alt_answers": [], "hint": "Volume = area × thickness. Get the volume from the mass and density, and convert the area to cm^2 (1 m^2 = 10^4 cm^2). Then convert the thickness from cm to nm.", "model_solution": "V = 31.10 g / 19.3 g/cm^3 = 1.611 cm^3\nArea = 21.0 m^2 × (10^4 cm^2 / 1 m^2) = 2.10 × 10^5 cm^2\nThickness = 1.611 cm^3 / 2.10 × 10^5 cm^2 = 7.673 × 10^-6 cm = 77 nm\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "MEAS-110", "topic": "Measurement & units", "chapter": "1", "text": "A veterinarian prescribes 5.0 mg of a medication per kilogram of body mass for a dog that weighs 55 lb. The medication comes in 25-mg tablets. (1 kg = 2.205 lb)", "background_image": "", "parts": [{"part": "a", "prompt": "How many tablets should the dog receive per dose? (Enter just the number.)", "type": "numeric", "value": 4.99, "units": "", "tolerance": "5%", "alt_answers": ["5"], "hint": "Convert the dog's mass to kg, use the dose rate to get mg, then divide by mg per tablet.", "model_solution": "55 lb × (1 kg / 2.205 lb) = 24.95 kg\n24.95 kg × (5.0 mg / 1 kg) = 125 mg\n125 mg × (1 tablet / 25 mg) = 4.99, so 5 tablets\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-101", "topic": "Measurement & units", "chapter": "1", "text": "A college class period lasts 90 minutes. A computer processor completes one simple operation in about 1 nanosecond (1 ns = 10^-9 s).", "background_image": "", "parts": [{"part": "a", "prompt": "How many nanoseconds long is the class period?", "type": "numeric", "value": 5400000000000, "units": "ns", "tolerance": "5%", "alt_answers": [], "hint": "Chain the conversions: minutes → seconds → nanoseconds.", "model_solution": "90 min × (60 s / 1 min) = 5400 s\n5400 s × (10^9 ns / 1 s) = 5.4 × 10^12 ns\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-102", "topic": "Measurement & units", "chapter": "1", "text": "A student invents the °Z temperature scale. On it, water freezes at −20 °Z and boils at 180 °Z (at 1 atm). Like Celsius and Fahrenheit, the two scales are related by a straight line: T(°Z) = m × T(°C) + b.", "background_image": "", "parts": [{"part": "a", "prompt": "What is normal body temperature, 37.0 °C, on the °Z scale? (Enter just the number.)", "type": "numeric", "value": 54, "units": "", "tolerance": "5%", "alt_answers": [], "hint": "Find the slope from the two fixed points: (180 − (−20)) °Z for every (100 − 0) °C. The intercept is the °Z reading at 0 °C.", "model_solution": "Slope m = (180 − (−20)) / (100 − 0) = 2 °Z per °C;  intercept b = −20 °Z\nT(°Z) = 2 × 37.0 − 20 = 54 °Z\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "At what temperature do the °Z and °C scales give the same reading? (Enter just the number.)", "type": "numeric", "value": 20, "units": "", "tolerance": "abs:0.5", "alt_answers": [], "hint": "Set T(°Z) = T(°C) = x in your equation and solve for x.", "model_solution": "x = 2x − 20  →  x = 20\nAt 20 °C the °Z scale also reads 20 °Z.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-103", "topic": "Measurement & units", "chapter": "1", "text": "While driving in Canada, you pay 1.62 Canadian dollars (CAD) per liter of gasoline. The exchange rate is 1 CAD = 0.73 US dollars (USD). (1 gal = 3.785 L)", "background_image": "", "parts": [{"part": "a", "prompt": "What is that price in US dollars per gallon? (Enter just the number.)", "type": "numeric", "value": 4.477, "units": "", "tolerance": "5%", "alt_answers": [], "hint": "Two conversions: liters → gallons (so the price is per gallon) and CAD → USD.", "model_solution": "1.62 CAD / 1 L × (3.785 L / 1 gal) × (0.73 USD / 1 CAD) = 4.48 USD per gallon\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-104", "topic": "Measurement & density", "chapter": "1", "text": "A thief replaces a 1.00-kg gold bar with a fake bar made of lead that has exactly the same size and shape. The density of gold is 19.3 g/cm^3; the density of lead is 11.3 g/cm^3.", "background_image": "", "parts": [{"part": "a", "prompt": "What is the mass of the fake lead bar, in grams?", "type": "numeric", "value": 585.5, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Same size means same volume. Find the volume of the gold bar first.", "model_solution": "V = 1000 g / 19.3 g/cm^3 = 51.81 cm^3\nMass of lead = 51.81 cm^3 × 11.3 g/cm^3 = 585 g\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "How much lighter is the fake bar than the real one, in grams?", "type": "numeric", "value": 414.5, "units": "g", "tolerance": "5%", "alt_answers": [], "hint": "Subtract the lead bar's mass from 1000 g.", "model_solution": "1000 g − 585 g = 415 g lighter\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-105", "topic": "Atoms & scale", "chapter": "1", "text": "A proton has a mass of 1.673 x 10^-24 g and a radius of about 0.84 fm (1 fm = 10^-15 m). Treat the proton as a sphere: V = (4/3)πr^3.", "background_image": "", "parts": [{"part": "a", "prompt": "What is the density of a proton, in g/cm^3?", "type": "numeric", "value": 673900000000000, "units": "g/cm^3", "tolerance": "5%", "alt_answers": [], "hint": "Convert the radius to cm first (1 fm = 10^-15 m = 10^-13 cm), find the volume, then divide mass by volume.", "model_solution": "r = 0.84 fm = 0.84 × 10^-13 cm\nV = (4/3)π(0.84 × 10^-13 cm)^3 = 2.483 × 10^-39 cm^3\nDensity = 1.673 × 10^-24 g / 2.483 × 10^-39 cm^3 = 6.74 × 10^14 g/cm^3\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "Compare this with the density of water (1.00 g/cm^3). What does this tell you about where the mass of an atom is located?", "type": "ungraded", "model_solution": "A proton is about 10^14 times denser than water. Nearly all of an atom's mass is packed into its tiny nucleus.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-106", "topic": "Measurement & density", "chapter": "1", "text": "The density of concrete is about 2.40 g/cm^3. A contractor in the US works in pounds and feet. (1 in. = 2.54 cm; 12 in. = 1 ft; 1 lb = 453.6 g)", "background_image": "", "parts": [{"part": "a", "prompt": "What is the density of concrete in lb/ft^3?", "type": "numeric", "value": 149.8, "units": "lb/ft^3", "tolerance": "5%", "alt_answers": [], "hint": "Convert the top (g → lb) and the bottom (cm^3 → ft^3). Remember 1 ft^3 = (30.48 cm)^3.", "model_solution": "2.40 g/cm^3 × (1 lb / 453.6 g) × (30.48 cm / 1 ft)^3 = 149.8 lb/ft^3\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "What is the mass, in pounds, of a concrete slab 4.0 ft × 4.0 ft × 4.0 in. thick?", "type": "numeric", "value": 799.1, "units": "lb", "tolerance": "5%", "alt_answers": [], "hint": "Convert the thickness to feet, find the volume in ft^3, then use your density from part a.", "model_solution": "4.0 in. = 0.333 ft;  V = 4.0 ft × 4.0 ft × 0.333 ft = 5.33 ft^3\nMass = 5.33 ft^3 × 149.8 lb/ft^3 = 799 lb\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-107", "topic": "Atoms & scale", "chapter": "1", "text": "A gold atom has a radius of about 144 pm, and its nucleus has a radius of about 7.0 fm. Treat both as spheres. (1 pm = 10^-12 m; 1 fm = 10^-15 m)", "background_image": "", "parts": [{"part": "a", "prompt": "What fraction of the gold atom's volume is taken up by its nucleus? (Enter just the number.)", "type": "numeric", "value": 1.149e-13, "units": "", "tolerance": "5%", "alt_answers": ["1.15e-11%"], "hint": "Fraction = V(nucleus) / V(atom). The (4/3)π cancels, so the fraction is (r_nucleus / r_atom)^3, with both radii in the same units.", "model_solution": "r_nucleus / r_atom = (7.0 × 10^-15 m) / (144 × 10^-12 m) = 4.86 × 10^-5\nFraction = (4.86 × 10^-5)^3 = 1.15 × 10^-13\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-108", "topic": "Atoms & scale", "chapter": "1", "text": "A carbon nucleus has a radius of about 2.7 fm, and a carbon atom has a radius of about 70 pm. Imagine enlarging the whole atom until the nucleus is the size of a marble with a radius of 0.80 cm.", "background_image": "", "parts": [{"part": "a", "prompt": "What would the radius of the enlarged atom be, in meters?", "type": "numeric", "value": 207.4, "units": "m", "tolerance": "5%", "alt_answers": [], "hint": "Find the scale factor: marble radius / real nucleus radius (same units!). Multiply the real atom radius by that same factor.", "model_solution": "Scale factor = 0.80 × 10^-2 m / 2.7 × 10^-15 m = 2.96 × 10^12\nEnlarged atom radius = 70 × 10^-12 m × 2.96 × 10^12 = 207 m\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "Compare your answer with the length of a football field (about 110 m). What does this tell you about the atom?", "type": "ungraded", "model_solution": "The atom would be about 210 m in radius, so roughly 400 m across: almost four football fields, with a marble at the center. An atom is mostly empty space.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CUM-109", "topic": "Measurement & density", "chapter": "1", "text": "A 2.5-kg block of dry ice (solid CO_2) is left in a closed walk-in cooler that measures 2.4 m × 2.0 m × 2.5 m, and it turns completely into CO_2 gas. At the cooler's temperature, CO_2 gas has a density of 1.98 g/L. (1 m^3 = 1000 L)", "background_image": "", "parts": [{"part": "a", "prompt": "What volume of CO_2 gas forms, in liters?", "type": "numeric", "value": 1263, "units": "L", "tolerance": "5%", "alt_answers": [], "hint": "Use the gas density to turn the mass of CO_2 into a volume.", "model_solution": "2500 g × (1 L / 1.98 g) = 1263 L\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "b", "prompt": "What fraction of the cooler's volume would the CO_2 gas occupy? (Enter just the number.)", "type": "numeric", "value": 0.1052, "units": "", "tolerance": "5%", "alt_answers": ["10.5%"], "hint": "Find the cooler's volume in m^3, convert the gas volume to m^3 (or the cooler to L), then divide.", "model_solution": "Cooler volume = 2.4 m × 2.0 m × 2.5 m = 12.0 m^3 = 12,000 L\nFraction = 1263 L / 12,000 L = 0.105 (about 11%)\n\nOriginal problem written for the Problem-Solving Coach."}, {"part": "c", "prompt": "Why is this a safety concern?", "type": "ungraded", "model_solution": "The CO_2 pushes out breathable air. Displacing about 10% of the air in a closed space can make people dizzy or unconscious, so dry ice should be kept in ventilated areas.\n\nOriginal problem written for the Problem-Solving Coach."}]}, {"id": "CHAL-101", "topic": "Challenge", "chapter": "1", "text": "An alcohol thermometer contains 0.500 g of ethano let downloads = null;
(async () => { try { if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); } catch { } })();
async function saveFile(name, data, mime) {
  if (downloads) {
    try { await downloads.save({ filename: name, data }); return true; }
    catch (e) { if (e && e.code === "declined") return false; }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    return true;
  } catch { toast("This view can't download files."); return false; }
}
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  loadScript.p = loadScript.p || {};
  if (loadScript.p[src]) return loadScript.p[src];
  return (loadScript.p[src] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src;
    s.onload = () => res(window[globalName]); s.onerror = () => { loadScript.p[src] = null; rej(new Error("load")); };
    document.head.appendChild(s);
  }));
}

function topicsOf(ps) {
  const ts = [...new Set(ps.map(p => p.topic || "Other"))];
  return ts.sort((a, b) => (TOPIC_ORDER.indexOf(a) + 1 || 99) - (TOPIC_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b));

function renderTopics() {

  box.innerHTML = `<span class="tlabel">Problem type:</span>` + chip("All", all.length) +

    `<button class="btn small" id="rnd" title="Open a random problem of the chosen type">Random problem</button>`;

let pen = "blue", painting = null;

function problemSegments() {

function problemWordList() { return problemSegments().flatMap(g => g.text.split(/\s+/).filter(Boolean)); }
function renderProblem() {

  const segs = problemSegments();

    `<div class="qs"><div class="qhead">${segs.length > 2 ? "Questions" : "Question"}</div>` +
    segs.slice(1).map(g => `<div class="q">${g.label ? `<span class="ql">${esc(g.label)}</span>` : ""}<span>${words(g.text)}</span></div>`).join("") + `</div>`;

  paintHighlights(); setPen(pen);

  $$("[data-pen]", $("#prob")).forEach(b => b.onclick = () => setPen(b.dataset.pen));
  $("#hl-clear").onclick = () => { S.hl = {}; paintHighlights(); changed(); };
  const pt = $("#ptext");
  pt.addEventListener("pointerdown", (e) => {
    const w = e.target.closest(".w"); if (!w) return;
    const i = w.dataset.i;

    applyHl(i); e.preventDefault();
  });
  pt.addEventListener("pointermove", (e) => {
    if (!painting) return;

function setPen(p) { pen = p; $$("[data-pen]", $("#prob")).forEach(b => b.classList.toggle("on", b.dataset.pen === p)); }
function applyHl(i) {

function hlWords(color) {
  const words = problemWordList();

  words.forEach((w, i) => { if (S.hl[i] === color) run.push(w); else if (run.length) { out.push(run.join(" ")); run = []; } });
  if (run.length) out.push(run.join(" "));

}

function pdfSafe(s) {

    .replace(/[₀-₉]/g, c => String(c.charCodeAt(0) - 0x2080))
    .replace(/−|–|—/g, "-").replace(/π/g, "pi").replace(/μ/g, "µ").replace(/→/g, "->")
    .replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, "...").replace(/✓/g, "(ok)").replace(/✗/g, "(no)")
    .replace(/[^\x00-\xFF]/g, "?");
}

    para(label, 11, "bold", 1);
    if (p.type === "ungraded") para(st.text || "-", 11, "normal", 6);
    else para(`Answer: ${st.input || "-"}    Result: ${st.correct ? "Correct" : st.tries ? "Not yet correct" : "Not checked"}    Attempts: ${st.tries || 0}`, 11, "normal", 6);
  });
  const ok = await saveFile(`${P.id}-work.pdf`, doc.output("blob"), "application/pdf");
  if (ok) toast("PDF ready.");
}

/* ---------- top bar ---------- */
$("#pick").onchange = (e) => openProblem(e.target.value);
$("#btn-pdf").onclick = exportPDF;
$("#btn-reset").onclick = () => {
  const b = $("#btn-reset");
  if (b.dataset.armed) { LS.del("psc:work:" + P.id); delete b.dataset.armed; b.textContent = "Start over"; b.classList.remove("on"); openProblem(P.id); toast("Started over."); return; }
  b.dataset.armed = "1"; b.textContent = "Click again to erase your work"; b.classList.add("on");
  setTimeout(() => { delete b.dataset.armed; b.textContent = "Start over"; b.classList.remove("on"); }, 4000);
};
function showTab(which) {
  $("#tab-solve").setAttribute("aria-selected", which === "solve"); $("#tab-inst").setAttribute("aria-selected", which === "inst");
  $("#view-solve").hidden = which !== "solve"; $("#view-inst").hidden = which !== "inst";
  if (which === "inst") renderInstructor();
  if (location.hash !== "#" + (which === "inst" ? "instructor" : "solve")) history.replaceState(null, "", "#" + (which === "inst" ? "instructor" : "solve"));
}
$("#tab-solve").onclick = () => showTab("solve");
$("#tab-inst").onclick = () => showTab("inst");

/* ---------- Instructor ---------- */
const COL_HELP = {
  problem_id: ["Yes", "Groups the parts of one problem, e.g. DENS-001. Every row of a problem uses the same ID."],
  topic: ["First row", "For grouping in the problem list, e.g. Density, Stoichiometry."],
  chapter: ["No", "Course chapter or unit."],
  problem_text: ["First row", "Full problem text. Use ^ for powers (m^3, 10^22) and _ for subscripts (H_2O)."],
  part: ["Yes", "a, b, c …"],
  part_prompt: ["Yes", "The question for this part."],
  answer_type: ["Yes", "numeric (graded) or ungraded (free-text response)."],
  answer_value: ["Numeric", "Your answer, e.g. 1.147 or 3.70e-5."],
  answer_units: ["If it has units", "e.g. g/mL, kg/m^3, J/(mol K). Leave blank for a unitless answer."],
  tolerance: ["No", "Blank = 5%. Or another percentage (2%), or an absolute tolerance (abs:0.00001)."],
  alt_answers: ["No", "Other accepted answers, separated by semicolons, e.g. 75; 76."],
  hint: ["Numeric", "Offered after 2 failed attempts."],
  model_solution: ["Numeric", "Your worked solution. Offered after 5 failed attempts or a correct answer. Line breaks inside the cell are kept."],
  background_image: ["No", "Optional image file name to draw over (works once the tool is on GitHub)."]
};
let pending = null, pendingJSON = "";
function renderInstructor() {
  const v = $("#view-inst");
  if (v.dataset.built) return;
  v.dataset.built = "1";
  v.innerHTML = `
  <div class="card">
    <h2>1. Get the spreadsheet template</h2>
    <p>One row per answer part. Rows with the same <code>problem_id</code> belong to the same problem. The template comes filled in with the three starter problems as examples.</p>
    <div class="bar"><button class="btn primary" id="tpl-xlsx">Download template (.xlsx)</button><button class="btn" id="tpl-csv">Download template (.csv)</button></div>
    <details><summary>Column guide</summary>
      <table class="cols"><tr><th>Column</th><th>Required</th><th>What goes in it</th></tr>
      ${PSC.COLS.map(c => `<tr><td><code>${c}</code></td><td>${esc(COL_HELP[c][0])}</td><td>${esc(COL_HELP[c][1])}</td></tr>`).join("")}</table>
    </details>
  </div>
  <div class="card">
    <h2>2. Upload your filled-in spreadsheet</h2>
    <p>Excel (.xlsx), CSV, or tab-delimited text. Every row is checked before anything is converted.</p>
    <input type="file" id="up" accept=".xlsx,.xls,.csv,.txt,.tsv">
    <div id="up-out"></div>
  </div>
  <div class="card">
    <h2>3. Convert to JSON</h2>
    <p>The tool reads its problems from a file named <code>problems.json</code>. When the tool goes on GitHub, that file sits next to the page, and replacing it updates the problems your students see.</p>
    <div class="bar"><button class="btn primary" id="to-json" disabled>Convert to JSON</button>
      <button class="btn" id="dl-json" disabled>Download problems.json</button><button class="btn" id="cp-json" disabled>Copy JSON</button>
      <button class="btn" id="try" disabled>Try these problems in the Solve tab</button></div>
    <textarea class="json" id="json-out" readonly placeholder="The JSON appears here after you convert." hidden></textarea>
  </div>
  <div class="card">
    <h2>Test a problems.json file</h2>
    <p class="note">Load a problems.json to try its problems in the Solve tab on this device.</p>
    <div class="bar"><input type="file" id="up-json" accept=".json"><span class="spacer"></span>
      <button class="btn" id="clear-up">Remove uploaded problems</button></div>
    <p class="note" id="up-count"></p>
  </div>`;
  const count = () => $("#up-count").textContent = uploaded.length ? `${uploaded.length} uploaded problem(s) on this device: ${uploaded.map(p => p.id).join(", ")}` : "No uploaded problems on this device. The Solve tab shows the starter problems.";
  count();
  $("#tpl-xlsx").onclick = async () => {
    try {
      const X = await loadScript(SHEETJS, "XLSX");
      const wb = X.utils.book_new();
      const ws = X.utils.aoa_to_sheet(PSC.problemsToRows(BUILTIN_PROBLEMS));
      ws["!cols"] = PSC.COLS.map(c => ({ wch: { problem_text: 60, model_solution: 60, hint: 40, part_prompt: 40 }[c] || 14 }));
      X.utils.book_append_sheet(wb, ws, "Problems");
      const guide = X.utils.aoa_to_sheet([["Column", "Required", "What goes in it"], ...PSC.COLS.map(c => [c, ...COL_HELP[c]])]);
      guide["!cols"] = [{ wch: 18 }, { wch: 14 }, { wch: 90 }];
      X.utils.book_append_sheet(wb, guide, "Column guide");
      const buf = X.write(wb, { bookType: "xlsx", type: "array" });
      await saveFile("problem-template.xlsx", new Blob([buf]), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    } catch { toast("Couldn't build the Excel file here. Try the CSV template."); }
  };
  $("#tpl-csv").onclick = () => {
    const csv = PSC.problemsToRows(BUILTIN_PROBLEMS).map(r => r.map(c => /[",\n]/.test(c) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\r\n");
    saveFile("problem-template.csv", "﻿" + csv, "text/csv");
  };
  $("#up").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    let rows;
    try {
      if (/\.(xlsx|xls)$/i.test(f.name)) {
        const X = await loadScript(SHEETJS, "XLSX");
        const wb = X.read(await f.arrayBuffer(), { type: "array" });
        rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false }).filter(r => r.some(c => String(c).trim()));
      } else rows = PSC.parseDelimited((await f.text()).replace(/^﻿/, ""));
    } catch { $("#up-out").innerHTML = `<div class="errs">Couldn't read that file. Upload an .xlsx, .csv, or tab-delimited .txt file.</div>`; return; }
    const r = PSC.rowsToProblems(rows);
    pending = r.errors.length ? null : r.problems;
    const nParts = r.problems.reduce((a, p) => a + p.parts.length, 0);
    $("#up-out").innerHTML = (r.errors.length
      ? `<div class="errs"><b>${r.errors.length} problem${r.errors.length > 1 ? "s" : ""} to fix before converting:</b><ul>${r.errors.map(x => `<li>${x.row ? `Row ${x.row}: ` : ""}${esc(x.msg)}</li>`).join("")}</ul></div>`
      : `<div class="okbox"><b>All rows check out.</b> ${r.problems.length} problem(s), ${nParts} part(s).</div>`) +
      `<div class="preview">${r.problems.map(p => `<div class="pp"><b>${esc(p.id)}</b> · ${esc(p.topic)}<div>${fmtText(p.text)}</div>
        <ul>${p.parts.map(x => `<li>${esc(x.part)}: ${fmtText(x.prompt)} → ${x.type === "numeric" ? `<b>${esc(UE.fmt(x.value, 6))} ${esc(x.units || "")}</b> (${esc(PSC.tolText(x.tolerance))})${x.alt_answers && x.alt_answers.length ? `; also accepts ${esc(x.alt_answers.join(", "))}` : ""}` : "<i>ungraded</i>"}</li>`).join("")}</ul></div>`).join("")}</div>`;
    $("#to-json").disabled = !pending;
    ["#dl-json", "#cp-json", "#try"].forEach(s => $(s).disabled = true); $("#json-out").hidden = true;
  };
  $("#to-json").onclick = () => {
    if (!pending) return;
    pendingJSON = PSC.toJSON(pending);
    const t = $("#json-out"); t.value = pendingJSON; t.hidden = false;
    ["#dl-json", "#cp-json", "#try"].forEach(s => $(s).disabled = false);
  };
  $("#dl-json").onclick = () => saveFile("problems.json", pendingJSON, "application/json");
  $("#cp-json").onclick = async () => { try { await navigator.clipboard.writeText(pendingJSON); toast("JSON copied."); } catch { $("#json-out").select(); toast("Press Ctrl+C (or ⌘C) to copy."); } };
  $("#try").onclick = () => { addUploaded(pending); count(); };
  $("#up-json").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { addUploaded(PSC.fromJSON(await f.text())); count(); } catch (err) { toast("That isn't a valid problems.json: " + err.message, 4000); }
  };
  $("#clear-up").onclick = () => { uploaded = []; LS.set("psc:uploaded", uploaded); count(); fillPicker(); toast("Uploaded problems removed."); };
}
function addUploaded(list) {
  const ids = new Set(list.map(p => p.id));
  uploaded = [...uploaded.filter(p => !ids.has(p.id)), ...list];
  LS.set("psc:uploaded", uploaded);
  fillPicker(list[0] && list[0].id);
  showTab("solve");
  toast(`${list.length} problem(s) added to the Solve tab.`);
}

/* ---------- start ---------- */
fillPicker();
showTab(location.hash === "#instructor" ? "inst" : "solve");
// On GitHub Pages, problems.json sits next to this page and replaces the starter problems.
(async () => {
  try {
    const r = await fetch("problems.json", { cache: "no-cache" });
    if (!r.ok) return;
    const list = PSC.fromJSON(await r.text());
    if (list.length) { siteProblems = list; fillPicker(P && P.id); }
  } catch { /* opened as a single file or inside a sandbox: keep the starter problems */ }
})();

</script>
</body>
</html>
